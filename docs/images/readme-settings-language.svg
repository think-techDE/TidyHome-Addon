<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Personen, Rollen und Sprache</title>
  <desc id="desc">TidyHome Einstellungen mit Rollen, Benachrichtigung, Sprache und Raum-Sichtbarkeit.</desc>
  <defs>
    <style>
      .bg{fill:#f4f0f2}.surface{fill:#fff;stroke:#ddd6da;stroke-width:1.5}.surface2{fill:#f7f3f5}.text{fill:#24181f;font-family:Inter,Segoe UI,Arial,sans-serif}.muted{fill:#6e6269}.accent{fill:#b5738a}.line{stroke:#ddd6da;stroke-width:1.3}.pill{fill:#f7dce8;stroke:#d59ab6}.select{fill:#fff;stroke:#cfc5ca;stroke-width:1.3}.check{fill:#e0f4e6}
    </style>
  </defs>
  <rect class="bg" width="1000" height="520" rx="26"/>
  <text class="text" x="52" y="72" font-size="36" font-weight="850">Einstellungen</text>
  <text class="muted" x="52" y="104" font-size="19">Profile, Rollen und Benachrichtigungen pro Person konfigurieren.</text>

  <rect x="52" y="136" width="896" height="314" rx="20" class="surface"/>
  <g transform="translate(82,168)">
    <circle cx="32" cy="32" r="32" fill="#f7dce8"/>
    <text x="15" y="43" font-size="29">👤</text>
    <text class="text" x="82" y="28" font-size="25" font-weight="850">Ben</text>
    <text class="muted" x="82" y="58" font-size="17">Elternteil · 1 Gerät</text>
    <rect x="706" y="8" width="96" height="36" rx="18" class="pill"/>
    <text x="735" y="31" font-size="15" font-weight="850" fill="#8f4167">Admin</text>
  </g>
  <line x1="82" y1="248" x2="918" y2="248" class="line"/>

  <g transform="translate(82,278)">
    <text class="text" x="0" y="0" font-size="17" font-weight="850">Benachrichtigung</text>
    <rect x="0" y="22" width="250" height="48" rx="12" class="select"/>
    <text class="muted" x="18" y="53" font-size="17">08:00</text>
    <rect x="274" y="22" width="150" height="48" rx="12" class="check"/>
    <text x="299" y="53" font-size="17" font-weight="850" fill="#23864e">Aktiv</text>
  </g>

  <g transform="translate(540,278)">
    <text class="text" x="0" y="0" font-size="17" font-weight="850">Anzeige</text>
    <rect x="0" y="22" width="300" height="48" rx="12" class="select"/>
    <text class="text" x="18" y="53" font-size="17" font-weight="850">Automatisch</text>
    <text class="muted" x="250" y="53" font-size="17">▾</text>
  </g>

  <g transform="translate(82,380)">
    <text class="text" x="0" y="0" font-size="17" font-weight="850">Rolle und Sicht</text>
    <rect x="0" y="22" width="250" height="48" rx="12" class="select"/>
    <text class="text" x="18" y="53" font-size="17" font-weight="850">Elternteil</text>
    <text class="muted" x="207" y="53" font-size="17">▾</text>
    <rect x="274" y="22" width="180" height="48" rx="12" class="check"/>
    <text x="299" y="53" font-size="17" font-weight="850" fill="#23864e">Kinder sehen</text>
  </g>

  <g transform="translate(540,380)">
    <text class="text" x="0" y="0" font-size="17" font-weight="850">Sprachen</text>
    <rect x="0" y="22" width="84" height="36" rx="18" class="pill"/>
    <text x="26" y="46" font-size="15" font-weight="850" fill="#8f4167">DE</text>
    <rect x="98" y="22" width="84" height="36" rx="18" class="pill"/>
    <text x="124" y="46" font-size="15" font-weight="850" fill="#8f4167">EN</text>
    <rect x="196" y="22" width="84" height="36" rx="18" class="pill"/>
    <text x="222" y="46" font-size="15" font-weight="850" fill="#8f4167">FR</text>
    <rect x="294" y="22" width="84" height="36" rx="18" class="pill"/>
    <text x="320" y="46" font-size="15" font-weight="850" fill="#8f4167">ES</text>
