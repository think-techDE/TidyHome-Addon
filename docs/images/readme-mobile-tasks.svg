<svg xmlns="http://www.w3.org/2000/svg" width="720" height="920" viewBox="0 0 720 920" role="img" aria-labelledby="title desc">
  <title id="title">Mobile Aufgabenansicht</title>
  <desc id="desc">Mobile TidyHome Aufgabenliste mit Filterchips, Wochenübersicht und klar getrennten Aktionen.</desc>
  <defs>
    <style>
      .phone{fill:#0c0d10}.screen{fill:#101114}.surface{fill:#17191f;stroke:#30333b;stroke-width:1.5}.surface2{fill:#20232b}.text{fill:#f7f1f3;font-family:Inter,Segoe UI,Arial,sans-serif}.muted{fill:#b9b0b6}.accent{fill:#c86f9a}.line{stroke:#30333b;stroke-width:1.2}.chip{fill:#352431;stroke:#7d435d;stroke-width:1.5}.chip2{fill:#20232b;stroke:#30333b;stroke-width:1.5}.ok{fill:#1f3a28}.warn{fill:#3b3020}
    </style>
  </defs>
  <rect class="phone" x="30" y="10" width="660" height="900" rx="48"/>
  <rect class="screen" x="52" y="34" width="616" height="852" rx="36"/>
  <text class="text" x="92" y="93" font-size="25" font-weight="850">TidyHome</text>
  <rect x="510" y="62" width="110" height="38" rx="19" fill="#352431" stroke="#7d435d"/>
  <text class="text" x="542" y="88" font-size="18" font-weight="850">Ben ▾</text>
  <line x1="52" y1="120" x2="668" y2="120" class="line"/>

  <text class="text" x="88" y="175" font-size="35" font-weight="850">Aufgaben</text>
  <rect x="88" y="208" width="104" height="40" rx="20" class="chip"/>
  <text fill="#ffd2e3" x="120" y="234" font-size="16" font-weight="850">Heute</text>
  <rect x="202" y="208" width="110" height="40" rx="20" class="chip2"/>
  <text class="muted" x="233" y="234" font-size="16" font-weight="800">Woche</text>
  <rect x="322" y="208" width="126" height="40" rx="20" class="chip2"/>
  <text class="muted" x="350" y="234" font-size="16" font-weight="800">Vorlagen</text>
  <rect x="458" y="208" width="112" height="40" rx="20" class="chip2"/>
  <text class="muted" x="487" y="234" font-size="16" font-weight="800">Historie</text>

  <rect x="88" y="274" width="532" height="74" rx="16" class="surface2"/>
  <text x="111" y="319" font-size="28">Mo</text>
  <text x="186" y="319" font-size="28">Di</text>
  <text x="259" y="319" font-size="28">Mi</text>
  <rect x="328" y="289" width="61" height="44" rx="22" fill="#c86f9a"/>
  <text class="text" x="345" y="318" font-size="20" font-weight="850">Do</text>
  <text x="419" y="319" font-size="28" fill="#b9b0b6">Fr</text>
  <text x="492" y="319" font-size="28" fill="#b9b0b6">Sa</text>
  <text x="565" y="319" font-size="28" fill="#b9b0b6">So</text>

  <g transform="translate(88,380)">
    <rect class="surface" width="532" height="128" rx="18"/>
    <circle cx="48" cy="48" r="36" fill="#20232b"/>
    <text x="30" y="60" font-size="28">🗑️</text>
    <text class="text" x="100" y="40" font-size="25" font-weight="850">Biomüll · Heute</text>
    <rect x="350" y="23" width="100" height="34" rx="17" class="ok"/>
    <text x="373" y="46" font-size="15" font-weight="850" fill="#72dd88">Geplant</text>
    <line x1="100" y1="70" x2="495" y2="70" class="line"/>
    <text x="112" y="106" font-size="26" fill="#66d07f">✓</text>
    <text x="210" y="106" font-size="26" fill="#b9b0b6">◷</text>
    <text x="310" y="106" font-size="26" fill="#b9b0b6">✎</text>
    <text x="414" y="106" font-size="26" fill="#ff6b61">□</text>
  </g>

  <g transform="translate(88,528)">
    <rect class="surface" width="532" height="150" rx="18"/>
    <circle cx="48" cy="48" r="36" fill="#20232b"/>
    <text x="27" y="60" font-size="28">🚗</text>
    <text class="text" x="100" y="39" font-size="25" font-weight="850">Auto saugen</text>
    <text class="muted" x="100" y="70" font-size="21" font-weight="700">In 29 Tagen</text>
    <rect x="350" y="22" width="100" height="34" rx="17" class="ok"/>
    <text x="373" y="45" font-size="15" font-weight="850" fill="#72dd88">Geplant</text>
    <rect x="365" y="62" width="75" height="30" rx="15" class="warn"/>
    <text x="384" y="83" font-size="15" font-weight="850" fill="#f0c65d">Mittel</text>
    <line x1="100" y1="98" x2="495" y2="98" class="line"/>
    <text x="112" y="134" font-size="26" fill="#66d07f">✓</text>
    <text x="210" y="134" font-size="26" fill="#b9b0b6">◷</text>
    <text x="310" y="134" font-size="26" fill="#b9b0b6">✎</text>
    <text x="414" y="134" font-size="26" fill="#ff6b61">□</text>
  </g>

  <rect x="52" y="790" width="616" height="96" fill="#17191f"/>
  <line x1="52" y1="790" x2="668" y2="790" class="line"/>
  <text x="100" y="835" font-size="28">🏠</text>
  <text x="88" y="864" font-size="17" font-weight="850" fill="#d680aa">Zuhause</text>
  <text x="225" y="835" font-size="28">🧹</text>
  <text class="muted" x="210" y="864" font-size="17" font-weight="850">Aufgaben</text>
  <text x="358" y="835" font-size="28">📦</text>
  <text class="muted" x="342" y="864" font-size="17" font-weight="850">Projekte</text>
  <text x="492" y="835" font-size="28">💡</text>
  <text class="muted" x="485" y="864" font-size="17" font-weight="850">Punkte</text>
  <text x="602" y="835" font-size="28">🔧</text>
  <text class="muted" x="599" y="864" font-size="17" font-weight="850">Ich</text>
</svg>
