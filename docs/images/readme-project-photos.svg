<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
  <title id="title">Projekt mit Vorher-Nachher-Fotos</title>
  <desc id="desc">TidyHome Projektansicht mit Fortschritt, Projektschritten, Notizen und Vorher-Nachher-Fotos.</desc>
  <defs>
    <style>
      .bg{fill:#f4f0f2}.surface{fill:#fff;stroke:#ddd6da;stroke-width:1.5}.surface2{fill:#f7f3f5}.text{fill:#24181f;font-family:Inter,Segoe UI,Arial,sans-serif}.muted{fill:#6e6269}.accent{fill:#b5738a}.success{fill:#23864e}.line{stroke:#ddd6da;stroke-width:1.3}.dark{fill:#17191f}.rose{fill:#f7dce8}.green{fill:#e0f4e6}.warn{fill:#fff2cf}
    </style>
  </defs>
  <rect class="bg" width="1000" height="640" rx="26"/>
  <rect x="46" y="38" width="908" height="90" rx="18" class="surface"/>
  <circle cx="96" cy="83" r="30" fill="#f7dce8"/>
  <text x="77" y="95" font-size="30">📦</text>
