<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
  <title id="title">Admin und Haushaltshilfen</title>
  <desc id="desc">TidyHome Admin-Beispiel mit Haushaltshilfe-Zeiterfassung, Lohnhistorie, Export und Diagnose.</desc>
  <defs>
    <style>
      .bg{fill:#101114}.surface{fill:#17191f;stroke:#30333b;stroke-width:1.5}.surface2{fill:#20232b}.text{fill:#f7f1f3;font-family:Inter,Segoe UI,Arial,sans-serif}.muted{fill:#b9b0b6}.accent{fill:#c86f9a}.line{stroke:#30333b;stroke-width:1.3}.btn{fill:#352431;stroke:#7d435d;stroke-width:1.6}.ok{fill:#1f3a28}.warn{fill:#3b3020}.danger{fill:#3b2323}
    </style>
  </defs>
  <rect class="bg" width="1000" height="640" rx="26"/>
  <text class="text" x="48" y="74" font-size="36" font-weight="850">Haushaltshilfen</text>
  <text class="muted" x="48" y="105" font-size="19">Arbeitszeiten, Stundensätze und Monatsabrechnung zentral prüfen.</text>

  <rect x="48" y="138" width="904" height="116" rx="18" class="surface"/>
  <text class="text" x="78" y="178" font-size="24" font-weight="850">Mai 2026</text>
  <g transform="translate(78,196)">
    <rect width="178" height="36" rx="18" class="ok"/>
    <text x="24" y="24" font-size="16" font-weight="850" fill="#72dd88">12,50 Stunden</text>
  </g>
  <g transform="translate(278,196)">
    <rect width="148" height="36" rx="18" class="warn"/>
    <text x="26" y="24" font-size="16" font-weight="850" fill="#f0c65d">225,00 EUR</text>
  </g>
  <rect x="720" y="174" width="88" height="42" rx="12" class="btn"/>
  <text x="748" y="201" font-size="16" font-weight="850" fill="#ffd2e3">CSV</text>
  <rect x="822" y="174" width="88" height="42" rx="12" class="btn"/>
  <text x="850" y="201" font-size="16" font-weight="850" fill="#ffd2e3">PDF</text>

  <rect x="48" y="282" width="432" height="272" rx="18" class="surface"/>
  <text class="text" x="78" y="324" font-size="24" font-weight="850">Arbeitszeit erfassen</text>
  <rect x="78" y="350" width="372" height="48" rx="12" class="surface2"/>
  <text class="muted" x="98" y="381" font-size="17">Marina</text>
  <rect x="78" y="416" width="170" height="46" rx="12" class="surface2"/>
  <text class="muted" x="98" y="445" font-size="16">09.05.2026</text>
  <rect x="280" y="416" width="170" height="46" rx="12" class="surface2"/>
  <text class="muted" x="300" y="445" font-size="16">30 Min. Pause</text>
  <rect x="78" y="480" width="372" height="46" rx="12" fill="#c86f9a"/>
  <text class="text" x="183" y="510" font-size="18" font-weight="850">Arbeitszeit speichern</text>

  <rect x="520" y="282" width="432" height="272" rx="18" class="surface"/>
  <text class="text" x="550" y="324" font-size="24" font-weight="850">Stundensatz und Historie</text>
  <g transform="translate(550,350)">
    <rect width="372" height="48" rx="12" class="surface2"/>
    <text class="text" x="18" y="31" font-size="18" font-weight="850">18,00 EUR</text>
    <text class="muted" x="142" y="31" font-size="16">ab 01.01.2026</text>
    <rect x="292" y="10" width="62" height="28" rx="14" class="ok"/>
    <text x="309" y="30" font-size="13" font-weight="850" fill="#72dd88">aktiv</text>
  </g>
  <g transform="translate(550,412)">
    <rect width="372" height="48" rx="12" class="surface2"/>
    <text class="text" x="18" y="31" font-size="18" font-weight="850">16,50 EUR</text>
    <text class="muted" x="142" y="31" font-size="16">bis 31.12.2025</text>
  </g>
  <rect x="550" y="480" width="178" height="42" rx="12" class="btn"/>
  <text x="579" y="507" font-size="16" font-weight="850" fill="#ffd2e3">Diagnose</text>
  <rect x="744" y="480" width="178" height="42" rx="12" class="btn"/>
  <text x="786" y="507" font-size="16" font-weight="850" fill="#ffd2e3">Backup</text>
</svg>
