<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9849c"/>
      <stop offset="100%" style="stop-color:#8f4f65"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Hintergrund -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#shine)"/>

  <!-- Haus-Silhouette -->
  <!-- Dach -->
  <polygon points="256,90 90,240 422,240" fill="#ffffff" opacity="0.95"/>
  <!-- Dachspitze-Schatten -->
  <polygon points="256,90 90,240 422,240" fill="#5a2d42" opacity="0.08"/>

  <!-- Haus-Koerper -->
  <rect x="128" y="230" width="256" height="190" rx="8" fill="#ffffff" opacity="0.95"/>

  <!-- Dach-Deckschicht (ueberlappt Koerper) -->
  <polygon points="256,90 90,240 170,240 256,162 342,240 422,240" fill="#f2d0db"/>

  <!-- Tuer -->
  <rect x="214" y="310" width="84" height="110" rx="42" fill="#b5738a"/>

  <!-- Haken (Checkmark) in der Tuer -->
  <polyline points="232,368 250,388 280,345"
            fill="none" stroke="#ffffff" stroke-width="14"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Fenster links -->
  <rect x="144" y="265" width="60" height="55" rx="10" fill="#f2d0db"/>
  <line x1="174" y1="265" x2="174" y2="320" stroke="#b5738a" stroke-width="3"/>
  <line x1="144" y1="292" x2="204" y2="292" stroke="#b5738a" stroke-width="3"/>

  <!-- Fenster rechts -->
  <rect x="308" y="265" width="60" height="55" rx="10" fill="#f2d0db"/>
  <line x1="338" y1="265" x2="338" y2="320" stroke="#b5738a" stroke-width="3"/>
  <line x1="308" y1="292" x2="368" y2="292" stroke="#b5738a" stroke-width="3"/>

  <!-- Kamin -->
  <rect x="330" y="110" width="30" height="70" rx="4" fill="#f2d0db"/>
  <rect x="324" y="106" width="42" height="14" rx="4" fill="#e8c8d4"/>
</svg>
